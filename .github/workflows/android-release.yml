name: Android GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to validate without publishing
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release tag and secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          node -e "const app=require('./app.json').expo; const pkg=require('./package.json'); const tag=process.env.RELEASE_TAG; if(tag !== 'v'+app.version || pkg.version !== app.version) throw new Error('Tag, app.json and package.json versions must match');"
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: |
          npm run format:check
          npm run typecheck
          npm run lint
          npm test -- --runInBand
          npx expo-doctor@latest

      - name: Generate Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          chmod 600 android/app/release.keystore

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare release files
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "release-artifacts/yueyouxu-${RELEASE_TAG}.apk"
          cd release-artifacts
          sha256sum "yueyouxu-${RELEASE_TAG}.apk" > "yueyouxu-${RELEASE_TAG}.apk.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: yueyouxu-${{ env.RELEASE_TAG }}-android
          path: release-artifacts/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release-artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "月有序 ${RELEASE_TAG}" \
            --generate-notes
